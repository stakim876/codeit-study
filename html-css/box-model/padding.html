<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      box-sizing: border-box;
    }
    .container {
      width: 300px;
      height: 300px;
      background: orange;
      margin: 100px;

      padding-top: 30px;
      padding-left: 20px;
    }
    .box {
      height: 50%;
      background: tomato;
      font-size: 2rem;
      padding: 20px;
    }
    input {
      width: 300px;
      padding: 10px;
    }

    .card {
      width: 250px;
      height: 350px;
      border: 2px solid gray;
      margin: 70px auto;
      border-radius: 15px;
      padding: 10px;
    }
    .card .image {
      height: 200px;
      border: 2px solid lightgray;
      border-radius: 15px;
      overflow: hidden;
    }
    .card .image img {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="image">
      <img src="https://search.pstatic.net/sunny/?src=https%3A%2F%2Fimage.aladin.co.kr%2Fproduct%2F35371%2F18%2Fletslook%2FK402035406_fl.jpg%3FRS%3D595%26WG%3D3%26WS%3D100%26%26WO%3D30%26WF%3D-15x15%26WU%3Dhttps%3A%2F%2Fimage.aladin.co.kr%2Fimg%2Fcommon%2Fopenmarket_ci.png&type=sc960_832" alt="아기상어 이미지">
    </div>
    <p class="text">blah~ blah~~</p>
  </div>


  <input type="text">

  <div class="container">
    <div class="box">안녕안녕</div>
  </div>

</body>
</html>
