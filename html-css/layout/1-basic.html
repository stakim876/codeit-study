<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        width: 50%;
        margin: 20px auto;
        border: 2px solid red;
        padding: 20px;
        display: flex;
      }
      .box {
        width: 100px;
        height: 100px;
        border: 2px solid orange;
        border-radius: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>
  </body>
</html>
