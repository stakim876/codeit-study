<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>함수 · Instagram</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>Instagram</h1>
    <p>팔로우, 좋아요처럼 같은 동작을 함수로 묶어 씁니다.</p>
  </header>


  <main>

    <section class="profile">
      <div class="avatar">승</div>
      <div>
        <h2>김승태</h2>
        <p>게시물 6 · 팔로워 128 · 팔로우 94</p>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-follow">팔로우</button>
      <button type="button">좋아요</button>
    </div>

  </main>


  <footer>
    <p>followUser() / likePost()</p>
  </footer>

  <script src="./main.js"></script>
</body>
</html>
