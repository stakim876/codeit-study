<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>access</title>
</head>
<body>
    
    <h1>상품명 확인</h1>

    <script>
        // 상품명을 문자열로 저장
        const productName = "무선 블루트스 키보드";

        // 문자열도 배열처럼 index를 사용해서 특정 위치의 문자에 접근 할 수 있다. //

        console.log("첫 번째 문자:", productName[0]);

        console.log("두 번째 문자:", productName[1]);

        console.log("마지막 문자:", productName[productName.length -1]
        );
    
        console.log(
            "상품명 길이:", productName.length
        );
    </script>
    
</body>
</html>
