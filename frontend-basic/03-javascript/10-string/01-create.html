<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create</title>
</head>
<body>
    
    <h1>상품 정보</h1>

    <script>
    // 상품명을 문자열로 저장.
    const productName = "삼성 겔럭시 버즈";

    // 상품명 출력.
    console.log("상품명:", productName);

    // 문자열의 길이를 확인 함.
    // length는 문자열에 몇 개의 문자가 있는지 알려줌.
    console.log("상품의 길이:", productName.length);

    //문자열 연결
    const message = "인기 상품: " + productName;

    console.log(message);
    </script>
    
</body>
</html>
