<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>method</title>
</head>
<body>
    

    <h1>상품 검색</h1>

    <script>
        // 상품명
        const productName = "Apple ipone 17 pro";

        // includes() 상품명에 특정 단어가 포함되어 있는지 확인
        console.log(
            "아이폰 포함 여부:",
            productName.includes("아이폰")
        );

        // indexof() 특정 단어가 몇 번째 위치에 있는지 확인
        console.log(
            "아이폰 위치:",
            productName.indexOf("아이폰")
        ); 

        const englishProduct = "apple airpods";

        console.log(
            "대문자:",
            englishProduct.toUpperCase()
        );

        // toLowerCase() 영어를 소문자로 변경
        const upperProduct = "APPLE AIRPODS";

        console.log(
            "소문자:", 
            upperProduct.toLowerCase()
        );
    </script>
    
</body>
</html>
