<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 생성</title>
</head>
<body>
    
    <h1>상품 목록</h1>

    <script>
        <!-- 여러 개의 상품을 하나의 배열에 저장 -->
        const products = [
            "노트북",
            "무선 키보드",
            "마우스",
            "모니터"
        ];

        <!-- 배열 전체 확인 -->
        console.log("전체 상품:", products);

        <!-- length를 사용하면 배열에 들어있는 데이터의 개수를 알 수 있음. -->
        console.log("상품 개수:", products.length);
    </script>

</body>
</html>
