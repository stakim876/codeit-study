<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>if 조건문 · NAVER</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>NAVER</h1>
    <p>조건이 맞을 때만 콘텐츠를 보여줍니다.</p>
  </header>


  <main>

    <section class="search">
      <input type="text" placeholder="검색어를 입력하세요" />
      <button type="button">검색</button>
    </section>

    <section>
      <h2>뉴스</h2>
      <ol>
        <li>코드잇 16기 프론트엔드 수업 시작</li>
        <li>자바스크립트 조건문으로 화면 나누기</li>
        <li>로그인하면 맞춤 정보가 바뀐다</li>
      </ol>
    </section>

    <section class="highlight">
      <h2>맞춤 콘텐츠</h2>
      <p>나이가 20살 이상이라서 이 영역이 보입니다.</p>
    </section>

  </main>


  <footer>
    <p>if (age &gt;= 20)</p>
  </footer>

  <script src="./main.js"></script>
</body>
</html>
