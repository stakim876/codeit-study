<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매개변수 · Instagram</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>Instagram</h1>
    <p>함수에 값을 넘겨서 같은 동작을 여러 사람에게 씁니다.</p>
  </header>


  <main>

    <section class="profile">
      <div class="avatar">승</div>
      <div>
        <h2>김승태</h2>
        <p>팔로우할 사용자 이름을 매개변수로 받습니다.</p>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-follow">팔로우</button>
      <button type="button">좋아요</button>
    </div>

  </main>


  <footer>
    <p>followUser(userName)</p>
  </footer>

  <script>
    <!-- 매개변수는 함수가 실행될 때 밖에서 받아오는 값 -->
    function followUser(userName) {
      console.log(userName + "님을 팔로우합니다.");
    }

    followUser("codeit_seungtae");
    followUser("minsu");
    followUser("younghee");

    function showProfile(userName, followerCount) {
      console.log("프로필:", userName);
      console.log("팔로워:", followerCount);
    }

    showProfile("김승태", 128);
  </script>
</body>
</html>
