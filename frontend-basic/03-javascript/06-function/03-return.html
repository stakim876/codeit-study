<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>return · Instagram</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>Instagram</h1>
    <p>함수가 계산한 결과를 return으로 돌려줍니다.</p>
  </header>


  <main>

    <section class="profile">
      <div class="avatar">승</div>
      <div>
        <h2>김승태</h2>
        <p>게시물 6 · 팔로워 128 · 팔로우 94</p>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-follow">팔로우</button>
      <button type="button">좋아요</button>
    </div>

  </main>


  <footer>
    <p>return followerCount + 1</p>
  </footer>

  <script>
    <!-- return은 함수 실행 결과를 밖으로 돌려줌 -->
    function addFollower(followerCount) {
      return followerCount + 1;
    }

    const currentFollowers = 128;
    const nextFollowers = addFollower(currentFollowers);

    console.log("현재 팔로워:", currentFollowers);
    console.log("팔로우 후:", nextFollowers);

    function getGreeting(userName) {
      return userName + "님, 환영합니다.";
    }

    const message = getGreeting("김승태");
    console.log(message);
  </script>
</body>
</html>
