<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화살표 함수 · Instagram</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>Instagram</h1>
    <p>function 대신 화살표(=>)로 함수를 짧게 씁니다.</p>
  </header>


  <main>

    <section class="profile">
      <div class="avatar">승</div>
      <div>
        <h2>김승태</h2>
        <p>게시물 6 · 팔로워 128 · 팔로우 94</p>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-follow">팔로우</button>
      <button type="button">좋아요</button>
    </div>

  </main>


  <footer>
    <p>const followUser = (userName) => { ... }</p>
  </footer>

  <script>
    <!-- 화살표 함수는 function 키워드 없이 함수를 만드는 방법 -->
    const followUser = (userName) => {
      console.log(userName + "님을 팔로우합니다.");
    };

    followUser("codeit_seungtae");

    const likePost = () => {
      console.log("게시물에 좋아요를 눌렀습니다.");
    };

    likePost();

    <!-- 값이 하나면 return을 생략하고 바로 결과를 돌려줄 수 있음 -->
    const addFollower = (followerCount) => followerCount + 1;

    console.log("팔로우 후:", addFollower(128));
  </script>
</body>
</html>
