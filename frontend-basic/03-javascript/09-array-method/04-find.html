<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find</title>
</head>
<body>

    <h1>find</h1>

    <script>
        const products = ["노트북", "무선 키보드", "마우스", "모니터"];

        <!-- find는 조건에 맞는 첫 번째 값 하나만 찾음 -->
        const foundProduct = products.find(function (product) {
            return product === "마우스";
        });

        console.log("찾은 상품:", foundProduct);

        const prices = [10000, 25000, 30000, 45000];
        const firstExpensive = prices.find(function (price) {
            return price >= 30000;
        });

        console.log("첫 번째 고가 상품:", firstExpensive);
    </script>

    <script src="./main.js"></script>
</body>
</html>
