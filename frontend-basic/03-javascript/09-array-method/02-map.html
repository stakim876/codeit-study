<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map</title>
</head>
<body>

    <h1>map</h1>

    <script>
        const prices = [10000, 25000, 30000];

        <!-- map은 배열의 각 값을 바꿔서 새로운 배열을 만듦 -->
        const salePrices = prices.map(function (price) {
            return price * 0.9;
        });

        console.log("원래 가격:", prices);
        console.log("할인 가격:", salePrices);

        const products = ["노트북", "마우스"];
        const labels = products.map(function (product) {
            return "인기 상품: " + product;
        });

        console.log(labels);
    </script>

    <script src="./main.js"></script>
</body>
</html>
