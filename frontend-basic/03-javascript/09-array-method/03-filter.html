<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
</head>
<body>

    <h1>filter</h1>

    <script>
        const prices = [10000, 25000, 30000, 45000, 50000];

        <!-- filter는 조건에 맞는 값만 모아서 새로운 배열을 만듦 -->
        const expensiveProducts = prices.filter(function (price) {
            return price >= 30000;
        });

        console.log("전체 가격:", prices);
        console.log("30000원 이상:", expensiveProducts);

        const products = ["노트북", "무선 키보드", "마우스", "모니터"];
        const longNames = products.filter(function (product) {
            return product.length >= 4;
        });

        console.log("이름이 긴 상품:", longNames);
    </script>

    <script src="./main.js"></script>
</body>
</html>
