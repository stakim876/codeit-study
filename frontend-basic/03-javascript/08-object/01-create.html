<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 생성</title>
</head>
<body>

    <h1>상품 정보</h1>

    <script>
        <!-- 객체는 관련된 데이터를 이름(key)과 값(value)으로 묶어서 저장 -->
        const product = {
            name: "노트북",
            price: 1200000,
            brand: "Codeit"
        };

        console.log("상품 객체:", product);
        console.log("상품명:", product.name);
        console.log("가격:", product.price);
    </script>

    <script src="./main.js"></script>
</body>
</html>
