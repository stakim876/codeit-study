<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 메서드</title>
</head>
<body>

    <h1>상품 메서드</h1>

    <script>
        const product = {
            name: "마우스",
            price: 35000,
            brand: "Codeit",

            <!-- 객체 안에 들어있는 함수를 메서드라고 함 -->
            showInfo: function () {
                console.log(this.brand + " " + this.name);
            },

            getDiscountPrice: function () {
                return this.price * 0.9;
            }
        };

        product.showInfo();
        console.log("할인 가격:", product.getDiscountPrice());
    </script>

    <script src="./main.js"></script>
</body>
</html>
