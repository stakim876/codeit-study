<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 프로퍼티</title>
</head>
<body>

    <h1>상품 프로퍼티</h1>

    <script>
        const product = {
            name: "무선 키보드",
            price: 89000,
            brand: "Codeit"
        };

        <!-- 점 표기법으로 프로퍼티에 접근 -->
        console.log("상품명:", product.name);

        <!-- 대괄호 표기법으로도 접근할 수 있음 -->
        console.log("가격:", product["price"]);

        <!-- 프로퍼티 값 변경 -->
        product.price = 79000;
        console.log("할인 가격:", product.price);

        <!-- 새로운 프로퍼티 추가 -->
        product.inStock = true;
        console.log("재고 여부:", product.inStock);
    </script>

    <script src="./main.js"></script>
</body>
</html>
