<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS Stack Order</title>
    <style>
        .container {
            width: 80%;
            margin: 50px auto;
            height: 400px;
            display: flex;
        }
        .box {
            width: 100px;
            height: 100px;
            background: tomato;
            border: 4px solid red;
            border-radius: 15px;
            font-size: 2em;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: -30px;

            position: relative;
        }
        /* 
          1. 밑에쓴 태그가 더 위에 쌓임
          2. position속성을 가지고 있으면 위로 올라감
        */

        .box3 {
          z-index: 2;
        }
        .box4 {
          z-index: -9999;
          left: -9999px;
        }
        .box5 {
        }
       
    </style>
</head>
<body>
    <!-- .container>.box.box${$}*5 -->
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
    </div>
</body>
</html>
