<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Position Absolute 2</title>
  <style>
    .root {
      width: 600px;
      height: 500px;
      border: 4px dashed orange;
      padding: 100px;
      font-size: 30px;
    }
    .parent {
      width: 400px;
      height: 300px;
      border: 4px dashed blue;
      padding: 50px;
      position: relative;
    }
    .child {
      width: 120px;
      height: 80px;
      border: 4px dashed red;
      background: tomato;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .close-btn button {
      display: block;
      width: 50px;
      height: 50px;
      border: none;
      background: red;
      color: white;
      font-size: 30px;
      border-radius: 50%;
      cursor: pointer;

      position: absolute;
      top: -20px;
      right: -20px;
    }

    .posa {
      /* 
      absolute의 이동 기준점은 
      부모요소의 포지션 유무에 따라 달라짐
       */
      position: absolute;
      right: 30px;
      bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="root">
      <div class="parent">
          <div class="child">1</div>
          <div class="child posa">2</div>
          <div class="child">3</div>
          <div class="close-btn">
              <button>X</button>
          </div>
      </div>
  </div>
</body>
</html>
