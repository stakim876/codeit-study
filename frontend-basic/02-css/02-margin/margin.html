<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Margin</title>
    <style>
        body {
            margin: 0;
        }

        .container {
            width: 400px;
            height: 300px;
            border: 4px solid red;
            margin-left: 20px;
            margin-top: 30px;
        }
        .box {
            width: 25%;
            height: 33%;
            border: 4px solid gray;
            background: #333;
        }
        .box:first-child {
            /* margin-bottom: 20px; */
            margin: 0 auto;
        }
        .box:last-child {
            /* 4시방향에 전부 7px씩 */
            margin: 7px;
            /*    [상하] [좌우] */
            margin: 10px 20px;
            /*  [상] [좌우] [하] */
            margin: 10px 20px 30px;
            /* 12부터 시계방향 */
            margin: 10px 20px 30px 40px;   
        }

        section {
            width: 80%;
            border: 4px solid green;
        }
        section h1 {
            background: orange;
            width: 40%;
            margin: 20px auto;
            text-align: center;
        }

    </style>
</head>
<body>

    <section>
        <h1>안녕하세요</h1>
        <h2>메롱메롱</h2>
    </section>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
