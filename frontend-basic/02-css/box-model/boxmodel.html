<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevStore 상품 상세</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- 상품 상세 영역 -->
  <main class="product">

    <div class="product-image">
      Keyboard
    </div>

    <section class="product-info">

      <span class="category">KEYBOARD</span>

      <h1>개발자용 기계식 키보드</h1>

      <p class="description">
        장시간 코딩에도 편안한 타건감과
        깔끔한 디자인을 갖춘 기계식 키보드입니다.
      </p>

      <div class="price">
        <strong>129,000원</strong>
        <span>무료배송</span>
      </div>

      <div class="options">

        <label for="color">색상</label>

        <select id="color">
          <option>화이트</option>
          <option>블랙</option>
          <option>그레이</option>
        </select>

      </div>

      <button type="button">
        장바구니 담기
      </button>

    </section>

  </main>

</body>
</html>
