<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevProfile</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- 프로필 카드 -->
  <main class="profile">

    <div class="profile-image">
      ST
    </div>

    <h1>김승태</h1>

    <p class="job">Frontend Developer</p>

    <p class="description">
      HTML, CSS, JavaScript와 React를 공부하며
      웹 서비스를 만들고 있습니다.
    </p>

    <div class="skills">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>React</span>
    </div>

    <a href="#" class="profile-button">
      프로필 보기
    </a>

  </main>


  <!-- 게시글 -->
  <section class="post">

    <div class="post-header">
      <strong>Frontend Daily</strong>
      <span>@frontend_daily</span>
    </div>

    <h2>CSS에서 Border를 제대로 사용하는 방법</h2>

    <p>
      border는 카드, 버튼, 입력창, 프로필 등
      다양한 UI 요소를 구분하는 데 사용합니다.
    </p>

    <a href="#">게시글 자세히 보기 →</a>

  </section>

</body>
</html>
