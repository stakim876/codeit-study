<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox 헤더 실습</title>

  <link rel="stylesheet" href="../01-css-basic/common.css">
  <link rel="stylesheet" href="practice1.css">
</head>
<body>
  <!--
    header 안 구조:
    logo | gnb(회사소개...) | snb(제품공정...)
    → 가로로 나란히 배치
  -->
  <header>
    <div class="inner">
      <h1 class="logo">
        <img src="https://kokokaki.github.io/img/logo1.png" alt="사이트 로고 이미지">
      </h1>

      <!-- gnb = 메인 메뉴 -->
      <nav class="gnb">
        <ul>
          <li><a href="#">회사소개</a></li>
          <li><a href="#">사업영역</a></li>
          <li><a href="#">투자정보</a></li>
          <li><a href="#">인재채용</a></li>
        </ul>
      </nav>

      <!-- snb = 서브 메뉴 -->
      <nav class="snb">
        <ul>
          <li><a href="#">알기쉬운 제품공정</a></li>
          <li><a href="#">내 삶속의 회사</a></li>
          <li><a href="#">제품검색</a></li>
        </ul>
      </nav>
    </div>
  </header>
</body>
</html>
