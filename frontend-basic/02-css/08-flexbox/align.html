<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flex Align</title>
  <style>
    * {
      box-sizing: border-box;
    }
    .container {
      height: 800px;
      border: 4px solid gray;
      padding: 20px 0;
      width: 80%;
      margin: 20px auto;
      display: flex;
      /* 배치 방향 결정 */
      flex-direction: row;
      flex-wrap: wrap;

      /* 주축 정렬 */
      justify-content: center;
      /* 교차축 정렬 */
      align-items: flex-end;
    }
    @media (max-width: 500px) {
      .container {
        flex-direction: column;
      }
    }
    .item {
      width: 33.3%;
      height: 100px;
      border: 4px solid red;
      font-size: 40px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
    </div>
</body>
</html>
