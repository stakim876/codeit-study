<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>CSS Font</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">

    <style>
      .ft {
        font-size: 30px;
      }
      .font1 {
        /* 바탕체 */
        font-family: serif;
      }
      .font2 {
        /* 고딕체 계열 */
        font-family: sans-serif;
      }
      .font3 {
        /* 고정폭 계열 */
        font-family: monospace;
      }
      .font4 {
        /* 필기체 계열 */
        font-family: cursive;
      }
      .font5 {
        /* 화려한 계열 */
        font-family: fantasy;
      }
      .font6 {
        font-family: "Bitcount Prop Single", system-ui;
      }
    </style>
  </head>
  <body>
    <!-- .ft.font${hello~ CSS!}*6 -->
    <div class="ft font1">hello~ CSS!</div>
    <div class="ft font2">hello~ CSS!</div>
    <div class="ft font3">hello~ CSS!</div>
    <div class="ft font4">hello~ CSS!</div>
    <div class="ft font5">hello~ CSS!</div>
    <div class="ft font6">hello~ CSS!</div>
  </body>
</html>
