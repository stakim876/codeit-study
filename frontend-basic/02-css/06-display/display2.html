<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevAdmin</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="dashboard">

    <!-- 사이드바 -->
    <aside class="sidebar">

      <h1>DevAdmin</h1>

      <nav>
        <a href="#">대시보드</a>
        <a href="#">회원 관리</a>
        <a href="#">게시글 관리</a>
        <a href="#">통계</a>
        <a href="#">설정</a>
      </nav>

    </aside>


    <!-- 메인 -->
    <main class="main">

      <header class="top">

        <div>
          <h2>대시보드</h2>
          <p>서비스 현황을 확인하세요.</p>
        </div>

        <button type="button">
          로그아웃
        </button>

      </header>


      <!-- 통계 카드 -->
      <section class="cards">

        <article class="card">
          <span>전체 회원</span>
          <strong>12,540</strong>
          <small>전월 대비 +12%</small>
        </article>

        <article class="card">
          <span>오늘 가입자</span>
          <strong>128</strong>
          <small>전일 대비 +8%</small>
        </article>

        <article class="card">
          <span>게시글</span>
          <strong>3,842</strong>
          <small>이번 달 +240</small>
        </article>

        <article class="card">
          <span>신고 접수</span>
          <strong>24</strong>
          <small>확인 필요</small>
        </article>

      </section>


      <!-- 최근 활동 -->
      <section class="activity">

        <div class="section-title">
          <h2>최근 활동</h2>
          <a href="#">전체 보기</a>
        </div>

        <div class="activity-list">

          <div class="activity-item">
            <strong>김승태</strong>
            <span>새로운 게시글을 작성했습니다.</span>
            <time>10분 전</time>
          </div>

          <div class="activity-item">
            <strong>Frontend Daily</strong>
            <span>회원 가입을 완료했습니다.</span>
            <time>25분 전</time>
          </div>

          <div class="activity-item">
            <strong>JavaScript Korea</strong>
            <span>게시글을 신고했습니다.</span>
            <time>1시간 전</time>
          </div>

        </div>

      </section>

    </main>

  </div>

</body>
</html>
