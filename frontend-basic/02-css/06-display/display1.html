<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codegram Profile</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="header">
    <a href="#" class="logo">Codegram</a>

    <nav>
      <a href="#">홈</a>
      <a href="#">탐색</a>
      <a href="#">알림</a>
    </nav>
  </header>


  <main class="profile">

    <section class="profile-info">

      <div class="profile-image">
        ST
      </div>

      <div class="profile-content">

        <h1>김승태</h1>

        <span class="username">@seungtae_dev</span>

        <p>
          Frontend Developer를 준비하고 있습니다.
          HTML, CSS, JavaScript를 공부하고 있습니다.
        </p>

        <a href="#" class="follow-button">
          팔로우
        </a>

        <a href="#" class="message-button">
          메시지
        </a>

      </div>

    </section>


    <section class="stats">

      <div>
        <strong>128</strong>
        <span>게시물</span>
      </div>

      <div>
        <strong>1,240</strong>
        <span>팔로워</span>
      </div>

      <div>
        <strong>320</strong>
        <span>팔로잉</span>
      </div>

    </section>


    <section class="posts">

      <article>HTML 공부</article>
      <article>CSS 공부</article>
      <article>JavaScript 공부</article>
      <article>React 공부</article>
      <article>포트폴리오</article>
      <article>개발 일상</article>

    </section>

  </main>

</body>
</html>
