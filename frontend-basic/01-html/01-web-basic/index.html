<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta 
        name="description"
        content="codeit 온라인 쇼핑몰 로그인 페이지"
       /> 

    <title>로그인 . shoply</title>
</head>

<body>
    <header>
        <h1>shoply</h1>
        <p>로그인하고 더 편리한 쇼핑을 시작하세요.</p>
    </header>    

    <main>
        <section>
            <h2>로그인</h2>
            <!--로그인 영역의 제목 -->

            <form id="login-form" action="#" method="post">
                <!-- 사용자가 입력한 로그인 정보를 전달하는 폼 -->

                <div>
                    <label for="email">이메일</label>
                    <!-- label과 input의 id를 연결-->

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="이메일을 입력하세요"
                        required
                        />
                        <!-- 이메일 형식의 값을 입력받음 -->
                </div>

                <div>
                    <label for="password">비밀번호</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="비밀번호를 입력하세요"
                        required
                        />
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="remember" />
                        로그인 상태 유지
                    </label>
                    <!-- 체크박스를 선택하면 로그인 상태 유지 -->
                </div>

                <button type="submit">로그인</button>
                <!-- 폼 데이터를 제출하는 버튼 -->
            </form>
        </section>

        <nav>
            <!-- 로그인 관련 페이지로 이동하는 메뉴 -->

            <a href="#">아이디 찾기</a>
            <a href="#">비밀번호 찾기</a>
            <a href="#">회원가입</a>
        </nav>
    </main>
</body>
</html>
