<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쿠팡 · 상품 버튼</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <header>
    <h1>Coupang</h1>
    <p>상품 구매에 필요한 버튼을 확인해보세요.</p>
  </header>


  <main>

    <!-- 상품 정보 -->
    <section class="product">

      <div class="product-image">
        <span>상품 이미지</span>
      </div>

      <div class="product-info">

        <p class="product-category">생활용품</p>

        <h2>프리미엄 무선 키보드</h2>

        <p class="product-description">
          편안한 타이핑과 깔끔한 디자인을 갖춘
          무선 키보드입니다.
        </p>

        <p class="product-price">
          <strong>39,900</strong>원
        </p>

        <p class="delivery">
          🚚 무료배송
        </p>

      </div>

    </section>


    <!-- 구매 버튼 -->
    <section class="purchase">

      <h2>구매하기</h2>

      <div class="button-group">

        <button type="button" class="btn-cart">
          장바구니
        </button>

        <button type="button" class="btn-buy">
          바로구매
        </button>

      </div>

      <button type="button" class="btn-wishlist">
        ♡ 찜하기
      </button>

    </section>


    <!-- 버튼 상태 -->
    <section class="button-example">

      <h2>버튼 상태</h2>

      <div class="button-row">

        <button type="button" class="btn-buy">
          구매하기
        </button>

        <button type="button" class="btn-buy btn-hover">
          Hover 상태
        </button>

        <button type="button" class="btn-buy" disabled>
          품절
        </button>

      </div>

    </section>


    <!-- 버튼 크기 -->
    <section class="button-size">

      <h2>버튼 크기</h2>

      <button type="button" class="btn-buy btn-small">
        작은 버튼
      </button>

      <button type="button" class="btn-buy">
        기본 버튼
      </button>

      <button type="button" class="btn-buy btn-large">
        큰 버튼
      </button>

    </section>

  </main>


  <footer>
    <p>상품 구매 버튼 UI</p>
  </footer>

</body>
</html>
