<main class="login">
  <section class="login-card">

    <h1>Instagram</h1>

    <form>
      <div class="form-group">
        <label for="email">아이디</label>
        <input
          id="email"
          type="text"
          placeholder="전화번호, 사용자 이름"
        >
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          id="password"
          type="password"
          placeholder="비밀번호"
        >
      </div>

      <button type="submit">
        로그인
      </button>
    </form>

    <p>또는</p>

    <a href="#">
      Facebook으로 로그인
    </a>

    <a href="#">
      비밀번호를 잊으셨나요?
    </a>

  </section>
</main>
